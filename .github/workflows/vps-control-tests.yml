name: VPS Control tests
on:
  push:
    branches: [feat/vps-control-panel]
  pull_request:
    paths:
      - "control-panel/**"
      - "podman-monitor/**"
      - "traefik-routing/**"
      - ".github/workflows/vps-control-tests.yml"
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate syntax
        run: python -m compileall -q control-panel podman-monitor traefik-routing
      - name: Run unit tests
        run: |
          python -m unittest discover -s podman-monitor -p 'test_*.py' -v
          python -m unittest discover -s traefik-routing -p 'test_*.py' -v
      - name: Validate baseline shell scripts
        run: |
          bash -n control-panel/install.sh podman-monitor/install.sh podman-monitor/provision-user.sh security/install-base.sh
