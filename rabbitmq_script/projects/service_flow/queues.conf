# Configuração de filas, exchanges e bindings para o projeto service_flow
# Formato: ACTION|arg1|arg2|arg3|...
#
# Ações disponíveis:
#   queue|nome|durable|auto_delete
#   exchange|nome|tipo|durable
#   bind|fila|exchange|routing_key

# Filas do service_flow
queue|tickets.created|true|false
queue|tickets.updated|true|false
queue|notifications.email|true|false
queue|notifications.sms|true|false

# Exchanges
exchange|tickets.topic|topic|true
exchange|notifications.direct|direct|true

# Bindings
bind|tickets.created|tickets.topic|ticket.created
bind|tickets.updated|tickets.topic|ticket.updated
bind|notifications.email|notifications.direct|email
bind|notifications.sms|notifications.direct|sms
