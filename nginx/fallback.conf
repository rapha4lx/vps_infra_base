server {
    listen 80 default_server;

    resolver 127.0.0.11 ipv6=off valid=30s;
    proxy_intercept_errors on;
    error_page 500 502 503 504 /error.html;

    location = /error.html {
        root /usr/share/nginx/html;
        internal;
    }

    location ~ ^/rabbitmq(?:/(.*))?$ {
        set $rabbitmq_upstream http://nginx_rabbitmq:15672;
        rewrite ^/rabbitmq(?:/(.*))?$ /$1 break;
        proxy_pass $rabbitmq_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/service_flow(?:/.*)?$ {
      # Resolve the upstream at request time so Nginx can start even if the
      # service container is not running yet.
      set $service_flow_upstream http://service_flow:4003;
      proxy_pass $service_flow_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/solana-wallet-gateway(?:/(.*))?$ {
        set $solana_wallet_gateway_upstream http://solana-wallet-gateway:3000;
        rewrite ^/solana-wallet-gateway(?:/(.*))?$ /$1 break;
        proxy_pass $solana_wallet_gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 200 "Nginx online\n";
    }
}
