services:
  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    restart: always
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "6380:6380"
      - "5433:5433"
      - "6379:6379"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/fallback.conf:/etc/nginx/conf.d/fallback.conf
      - ./nginx/error.html:/usr/share/nginx/html/error.html:ro
    networks:
      - nginx-network
    depends_on:
      - rabbitmq
      - postgres
      - redis

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: nginx_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_ADMIN_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_ADMIN_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST}
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nginx-network

  redis:
    image: redis:7-alpine
    container_name: nginx_redis
    restart: unless-stopped
    command: sh -c "test -s /data/users.acl || printf 'user default on >%s sanitize-payload ~* &* +@all\\n' '${REDIS_PASSWORD}' > /data/users.acl; exec redis-server --appendonly yes --aclfile /data/users.acl"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nginx-network

  postgres:
    image: postgres:16-alpine
    container_name: nginx_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nginx-network

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:

networks:
  nginx-network:
    external: true
